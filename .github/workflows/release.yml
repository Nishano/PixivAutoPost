name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Create release archive
        run: |
          archive_path="/tmp/pixiv-autopost-${GITHUB_REF_NAME}.tar.gz"
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=.env \
            --exclude='data/*.json' \
            --exclude=temp \
            --exclude=bot.log \
            --exclude='pixiv-autopost-*.tar.gz' \
            -czf "${archive_path}" .
          echo "RELEASE_ARCHIVE=${archive_path}" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ${{ env.RELEASE_ARCHIVE }}
